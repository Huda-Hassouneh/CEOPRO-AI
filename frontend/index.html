<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEEL — Business Intelligence</title>
    <meta name="description" content="KEEL turns your sales, stock, pricing and competitor data into clear daily decisions." />
    <meta name="application-name" content="KEEL" />
    <meta property="og:site_name" content="KEEL" />
    <meta property="og:title" content="KEEL — Business Intelligence" />
    <meta property="og:description" content="Sales, demand, pricing and competitor intelligence for growing businesses." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="theme-color" content="#e4e6ea" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="gl-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="flow" />
        <feGaussianBlur in="flow" stdDeviation="2.5" result="lens" />
        <feDisplacementMap in="SourceGraphic" in2="lens" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
