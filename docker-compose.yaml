services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: CEOPROTEST3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ceopro_postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CEOPROTEST3"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ceopro_postgres_data:
