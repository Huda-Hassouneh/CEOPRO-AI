name: Secret scan

# Fails a pull request or push whose NEW commits contain a secret. Rules and the
# short allowlist of known false positives live in .gitleaks.toml. Only the
# commits being added are scanned: values already in history are handled by
# rotating them (backend/PENDING_ACTIONS.md #104), not by failing every build.
# Zero-cost: a pinned public gitleaks image on a GitHub-hosted runner.

on:
  pull_request:
  push:
    branches: [main, KEEL_Test]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A brand-new branch has no "before" (all zeros): scan only its tip.
          case "$BASE_SHA" in ""|0000000000000000000000000000000000000000) RANGE="-1 $HEAD_SHA" ;; *) RANGE="$BASE_SHA..$HEAD_SHA" ;; esac
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 git /repo \
            --log-opts="$RANGE" --redact --no-banner -c /repo/.gitleaks.toml
