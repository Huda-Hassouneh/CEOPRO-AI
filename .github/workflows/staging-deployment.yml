name: Staging Deployment

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Disabled 2026-08-08 (PENDING_ACTIONS.md #28): neither a root-level
      # requirements.txt nor src/infrastructure/openapi_extractor.py exist
      # anywhere in this repo, so this step fails on every run. Re-enable
      # (drop `if: false`) once Infra/DevOps adds both.
      - name: Build and Extract OpenAPI Schema
        if: false
        run: |
          pip install -r requirements.txt
          python src/infrastructure/openapi_extractor.py
        env:
          # CI-only placeholders for OpenAPI extraction (no live DB is touched
          # in this step). Stored as repo secrets, not inlined, so nothing
          # resembling a real credential lives in the workflow file.
          JWT_SECRET: ${{ secrets.CI_OPENAPI_JWT_PLACEHOLDER }}
          DATABASE_URL: ${{ secrets.CI_OPENAPI_DB_PLACEHOLDER }}
