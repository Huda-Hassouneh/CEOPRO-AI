name: RAG runtime check

# The assistant's retrieval with the real models (downloaded from the
# Hugging Face hub), a real migrated database and, when the GROQ_API_KEY
# repository secret is set, real Groq answers - plus the memory each stage
# needs, so hosting limits are checked against measured numbers. The unit
# tests mock the models, and the sandbox this repo is often developed in
# can't download them. See backend/scripts/rag_runtime_check.py.
#
# Runs on pushes to KEEL_Test that touch the assistant, and by hand once
# this file is on the default branch. Public-repo Actions minutes are free;
# with the Groq secret set it makes two LLM calls on Groq's free tier.
on:
  push:
    branches: [KEEL_Test]
    paths:
      - backend/src/ai/rag/**
      - backend/src/ai/core/ml_runtime.py
      - backend/src/ai/requirements.txt
      - backend/scripts/rag_runtime_check.py
      - .github/workflows/rag-runtime-check.yml
  workflow_dispatch:

jobs:
  rag-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ceopro_admin
          POSTGRES_PASSWORD: rag_check_admin_password
          POSTGRES_DB: ceopro_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceopro_admin -d ceopro_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for this job's own ephemeral database only.
      DATABASE_URL: postgresql://ceopro_admin:rag_check_admin_password@localhost:5432/ceopro_platform
      AI_TEST_DATABASE_URL: postgresql://ceopro_admin:rag_check_admin_password@localhost:5432/ceopro_platform
      APP_DB_PASSWORD: rag_check_app_password
      JWT_SECRET: rag-check-jwt-secret-never-used-outside-this-job
      # Empty when the repository secret isn't set: the LLM part is then skipped, not faked.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # torch's default wheel bundles a ~4.6 GB CUDA stack; same disk fix as pr-checks.yml.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -a -f
          df -h /

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r src/ai/requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: python scripts/apply_migrations.py

      - name: Real models, real database, real LLM when configured
        working-directory: backend
        run: python -m scripts.rag_runtime_check --probe-onnx
