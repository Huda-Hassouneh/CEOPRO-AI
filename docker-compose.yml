services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ceopro_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceopro_core_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ceopro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ceopro_core_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0-alpine
    container_name: ceopro_redis_exporter
    environment:
      - REDIS_ADDR=redis://ceopro_redis:6379
    ports:
      - "9121:9121"
    networks:
      - ceopro_core_net
      - ceopro_telemetry_net
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ceopro_prometheus
    mem_limit: 512m
    volumes:
      - ./src/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./src/infrastructure/monitoring/market-scraper-alerts.yml:/etc/prometheus/market-scraper-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - ceopro_core_net
      - ceopro_telemetry_net
    depends_on:
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.0
    container_name: ceopro_loki
    mem_limit: 512m
    volumes:
      - ./src/infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - ceopro_telemetry_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: ceopro_promtail
    mem_limit: 256m
    volumes:
      - ./src/infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - ceopro_telemetry_net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ceopro_grafana
    mem_limit: 256m
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./src/infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./src/infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - ceopro_telemetry_net
    depends_on:
      prometheus:
        condition: service_started

  minio:
    image: minio/minio
    container_name: ceopro_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - ceopro_core_net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: python:3.11-slim
    container_name: ceopro_migrate
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: sh -c "pip install --no-cache-dir psycopg2-binary && python scripts/apply_migrations.py"
    networks:
      - ceopro_core_net
    depends_on:
      postgres:
        condition: service_healthy

  market-scraper:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      # src/infrastructure/db_pool.py connection pool sizing for this
      # process's ceopro_app connections - see .env.example.
      SCRAPER_DB_POOL_MIN_SIZE: ${SCRAPER_DB_POOL_MIN_SIZE:-1}
      SCRAPER_DB_POOL_MAX_SIZE: ${SCRAPER_DB_POOL_MAX_SIZE:-10}
      REDIS_URL: redis://redis:6379/0
      SCRAPER_STREAM_KEY: ${SCRAPER_STREAM_KEY:-market.scrape.requested}
      SCRAPER_DEAD_STREAM_KEY: ${SCRAPER_DEAD_STREAM_KEY:-market.scrape.dead}
      SCRAPER_MAX_ATTEMPTS: ${SCRAPER_MAX_ATTEMPTS:-3}
      SCRAPER_CLAIM_IDLE_MS: ${SCRAPER_CLAIM_IDLE_MS:-300000}
      SCRAPER_STALE_JOB_MINUTES: ${SCRAPER_STALE_JOB_MINUTES:-30}
      SCRAPER_METRICS_PORT: 9108
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-CEOPRO-MarketResearchBot/1.0}
    expose:
      - "9108"
    networks:
      - ceopro_core_net
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  market-analysis-worker:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-analysis
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.analysis_worker"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      SCRAPER_DB_POOL_MIN_SIZE: ${SCRAPER_DB_POOL_MIN_SIZE:-1}
      SCRAPER_DB_POOL_MAX_SIZE: ${SCRAPER_DB_POOL_MAX_SIZE:-10}
      REDIS_URL: redis://redis:6379/0
    networks:
      - ceopro_core_net
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Consumes market.discovery.requested, published by src/ai/main.py's
  # POST /extraction/upload right after real new products are persisted -
  # runs tenant_discovery.py's full competitor discovery (see
  # discovery_worker.py's own module docstring for the gap this closes).
  # Uses the market-scraper image, not market-analysis: this worker only
  # ever imports from src/market_scraper/, never src/ai/.
  market-discovery-worker:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.discovery_worker"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      SCRAPER_DB_POOL_MIN_SIZE: ${SCRAPER_DB_POOL_MIN_SIZE:-1}
      SCRAPER_DB_POOL_MAX_SIZE: ${SCRAPER_DB_POOL_MAX_SIZE:-10}
      REDIS_URL: redis://redis:6379/0
      DISCOVERY_STREAM_KEY: ${DISCOVERY_STREAM_KEY:-market.discovery.requested}
      DISCOVERY_DEAD_STREAM_KEY: ${DISCOVERY_DEAD_STREAM_KEY:-market.discovery.dead}
      DISCOVERY_MAX_ATTEMPTS: ${DISCOVERY_MAX_ATTEMPTS:-3}
      DISCOVERY_CLAIM_IDLE_MS: ${DISCOVERY_CLAIM_IDLE_MS:-300000}
    networks:
      - ceopro_core_net
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scheduled polling for both connector types - direct-database
  # (connector_sync.py) and generic POS/ERP/API (api_connector_sync.py).
  # Neither had ever been wired into a running process before this
  # worker existed - see connector_worker.py's own module docstring.
  # Not event-driven (no Redis dependency): a client's own database or
  # API doesn't publish an event when it changes, so this polls instead.
  market-connector-worker:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.connector_worker"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      SCRAPER_DB_POOL_MIN_SIZE: ${SCRAPER_DB_POOL_MIN_SIZE:-1}
      SCRAPER_DB_POOL_MAX_SIZE: ${SCRAPER_DB_POOL_MAX_SIZE:-10}
      CONNECTOR_WORKER_POLL_INTERVAL_SECONDS: ${CONNECTOR_WORKER_POLL_INTERVAL_SECONDS:-300}
    networks:
      - ceopro_core_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  market-maintenance:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.maintenance"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_STALE_JOB_MINUTES: ${SCRAPER_STALE_JOB_MINUTES:-30}
      SCRAPER_MAINTENANCE_INTERVAL_SECONDS: ${SCRAPER_MAINTENANCE_INTERVAL_SECONDS:-300}
      SCRAPER_MAINTENANCE_METRICS_PORT: 9109
    expose:
      - "9109"
    networks:
      - ceopro_core_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PENDING_ACTIONS.md #2/#25 - the first service that ever connects to
  # Postgres as the restricted ceopro_app role (via src/ai/db.py) instead of
  # the superuser ceopro_admin every other DB-touching path in this file
  # uses. DATABASE_URL below is still the superuser connection string, same
  # as `migrate` - src/ai/db.py derives the ceopro_app connection from it at
  # request time, it's never used directly for app traffic.
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: ceopro_ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # src/infrastructure/db_pool.py connection pool sizing for this
      # process's ceopro_app connections - see .env.example.
      APP_DB_POOL_MIN_SIZE: ${APP_DB_POOL_MIN_SIZE:-1}
      APP_DB_POOL_MAX_SIZE: ${APP_DB_POOL_MAX_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RAG chat's LLM provider (src/ai/rag/llm_client.py) - previously never
      # wired through here at all, so /rag/query would always fail with
      # "GROQ_API_KEY is not set" in a real docker-compose deployment despite
      # working when run outside Docker with the var exported directly.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-400}
      # Set to route generation at the llm-local service below (or any other
      # OpenAI-compatible endpoint) instead of Groq - leave blank for Groq,
      # the unchanged default. From inside this container, the llm-local
      # service's own address is http://llm-local:8080/v1/chat/completions -
      # NOT 127.0.0.1:8090, which only resolves from the host machine.
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-90}
      # Optional - market_scraper/places_discovery.py and
      # social_cross_reference.py degrade to returning [] when unset.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_CUSTOM_SEARCH_API_KEY: ${GOOGLE_CUSTOM_SEARCH_API_KEY:-}
      GOOGLE_CUSTOM_SEARCH_CX: ${GOOGLE_CUSTOM_SEARCH_CX:-}
      # Published by POST /extraction/upload right after new products are
      # persisted; consumed by the market-discovery-worker service below -
      # must match that service's own DISCOVERY_STREAM_KEY.
      DISCOVERY_STREAM_KEY: ${DISCOVERY_STREAM_KEY:-market.discovery.requested}
    ports:
      - "8001:8000"
    networks:
      - ceopro_core_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Zero-cost, fully local alternative to Groq for RAG chat generation - the
  # official llama.cpp server image (https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md),
  # CPU-only build, no GPU required. NOT started by default (`docker compose
  # up` skips it) - it only runs when explicitly requested via
  # `docker compose --profile local-llm up`, since it needs a real model file
  # in ./models/ first (run `python scripts/download_local_llm_model.py`
  # once) and most deployments will use Groq instead. Live-verified
  # 2026-09-06 with Qwen2.5-3B-Instruct (Q5_K_M): ~6 tokens/sec generation on
  # a 4-core/8-thread CPU - real and usable, genuinely slower than Groq's
  # hardware-accelerated hosting. Point the `ai` service's LOCAL_LLM_BASE_URL
  # at http://llm-local:8080/v1/chat/completions to actually use it.
  llm-local:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ceopro_llm_local
    profiles: ["local-llm"]
    volumes:
      - ./models:/models
    command: >
      -m /models/qwen2.5-3b-instruct-q5_k_m.gguf
      --host 0.0.0.0 --port 8080 -t 4 -c 4096
    ports:
      - "8090:8080"
    networks:
      - ceopro_core_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  minio_data:

networks:
  ceopro_core_net:
    driver: bridge
  ceopro_telemetry_net:
    driver: bridge
