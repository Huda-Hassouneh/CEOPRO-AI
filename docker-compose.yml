services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ceopro_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceopro_core_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ceopro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ceopro_core_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0-alpine
    container_name: ceopro_redis_exporter
    environment:
      - REDIS_ADDR=redis://ceopro_redis:6379
    ports:
      - "9121:9121"
    networks:
      - ceopro_core_net
      - ceopro_telemetry_net
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ceopro_prometheus
    mem_limit: 512m
    volumes:
      - ./src/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./src/infrastructure/monitoring/market-scraper-alerts.yml:/etc/prometheus/market-scraper-alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - ceopro_core_net
      - ceopro_telemetry_net
    depends_on:
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.0
    container_name: ceopro_loki
    mem_limit: 512m
    volumes:
      - ./src/infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - ceopro_telemetry_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: ceopro_promtail
    mem_limit: 256m
    volumes:
      - ./src/infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - ceopro_telemetry_net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ceopro_grafana
    mem_limit: 256m
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./src/infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./src/infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - ceopro_telemetry_net
    depends_on:
      prometheus:
        condition: service_started

  minio:
    image: minio/minio
    container_name: ceopro_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - ceopro_core_net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: python:3.11-slim
    container_name: ceopro_migrate
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: sh -c "pip install --no-cache-dir psycopg2-binary && python scripts/apply_migrations.py"
    networks:
      - ceopro_core_net
    depends_on:
      postgres:
        condition: service_healthy

  market-scraper:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      REDIS_URL: redis://redis:6379/0
      SCRAPER_STREAM_KEY: ${SCRAPER_STREAM_KEY:-market.scrape.requested}
      SCRAPER_DEAD_STREAM_KEY: ${SCRAPER_DEAD_STREAM_KEY:-market.scrape.dead}
      SCRAPER_MAX_ATTEMPTS: ${SCRAPER_MAX_ATTEMPTS:-3}
      SCRAPER_CLAIM_IDLE_MS: ${SCRAPER_CLAIM_IDLE_MS:-300000}
      SCRAPER_STALE_JOB_MINUTES: ${SCRAPER_STALE_JOB_MINUTES:-30}
      SCRAPER_METRICS_PORT: 9108
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-CEOPRO-MarketResearchBot/1.0}
    expose:
      - "9108"
    networks:
      - ceopro_core_net
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  market-analysis-worker:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-analysis
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.analysis_worker"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_ACTOR_USER_ID: ${SCRAPER_ACTOR_USER_ID}
      REDIS_URL: redis://redis:6379/0
    networks:
      - ceopro_core_net
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  market-maintenance:
    build:
      context: .
      dockerfile: src/infrastructure/Dockerfile.market-scraper
    restart: unless-stopped
    command: ["python", "-m", "src.market_scraper.maintenance"]
    environment:
      SCRAPER_DATABASE_URL: postgresql://ceopro_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_STALE_JOB_MINUTES: ${SCRAPER_STALE_JOB_MINUTES:-30}
      SCRAPER_MAINTENANCE_INTERVAL_SECONDS: ${SCRAPER_MAINTENANCE_INTERVAL_SECONDS:-300}
      SCRAPER_MAINTENANCE_METRICS_PORT: 9109
    expose:
      - "9109"
    networks:
      - ceopro_core_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  minio_data:

networks:
  ceopro_core_net:
    driver: bridge
  ceopro_telemetry_net:
    driver: bridge
