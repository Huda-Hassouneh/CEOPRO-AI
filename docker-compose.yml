version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ceopro_postgres
    environment:
      POSTGRES_USER: ceopro_admin
      POSTGRES_PASSWORD: SecurePassword2026
      POSTGRES_DB: ceopro_platform
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceopro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceopro_admin -d ceopro_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ceopro_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ceopro_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: ceopro_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioSecurePassword2026
    volumes:
      - minio_data:/data
    networks:
      - ceopro_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ceopro_network:
    driver: bridge
