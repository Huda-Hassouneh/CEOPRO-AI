server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ceopro-hardened-containers-telemetry
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: log_level
            tenant_id: tenant_id
            status_code: status_code
            msg: message
      - labels:
          level:
          tenant_id:
          status_code:
      - replace:
          expression: "([A-Za-z0-9+/]{40,})"
          replace: "[REDACTED_SENSITIVE_DATA]"
      - replace:
          expression: "(password|passwd|secret|jwt_secret|token)=\\S+"
          replace: "=[REDACTED_CREDENTIAL]"
